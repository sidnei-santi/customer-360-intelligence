name: CD Pipeline - Deploy Databricks

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks CLI
        run: |
          python -m pip install --upgrade pip
          pip install databricks-cli

      - name: Configure Databricks authentication
        run: |
          databricks configure --token <<EOF
          ${{ secrets.DATABRICKS_HOST }}
          ${{ secrets.DATABRICKS_TOKEN }}
          EOF

      - name: Validate Databricks Bundle before deploy
        run: |
          databricks bundle validate

      - name: Deploy to Databricks workspace
        run: |
          databricks bundle deploy

      - name: Success
        run: echo "🚀 Deploy concluído com sucesso no Databricks!"
